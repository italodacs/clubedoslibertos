name: Newsletter semanal

on:
  schedule:
    # 10:00 UTC = 07:00 em Brasilia, toda segunda-feira.
    - cron: "0 10 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  edicao:
    runs-on: ubuntu-latest
    # Os segredos vivem num environment, nao no nivel do repositorio. Sem esta
    # linha, `secrets.*` chega vazio e o job quebra na primeira variavel lida.
    # O nome do environment e infeliz — e o nome de um dos segredos, nao um
    # ambiente — mas trocar exigiria recadastrar os tres valores.
    environment: BREVO_API_KEY
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # Mesma versao da maquina de desenvolvimento, para o CI nao divergir.
          python-version: "3.14"

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      # Roda antes de montar a edicao de proposito: se uma mudanca quebrou o
      # pipeline, e melhor descobrir sem gastar cota do Gemini.
      - name: Rodar os testes
        run: python -m pytest tests/ -q

      - name: Montar a edicao e criar o rascunho
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SERPER_KEY: ${{ secrets.SERPER_KEY }}
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          # Variable, nao secret: o id da lista nao e sigiloso, e como secret o
          # GitHub mascarava todo digito "3" nos logs — inclusive dentro de
          # nomes de modelo e numeros de porta, o que atrapalhava diagnostico.
          BREVO_LIST_ID: ${{ vars.BREVO_LIST_ID }}
        run: python -m newsletter.main

      - name: Guardar o html quando o Brevo falha
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: edicao-html
          path: saida/
          if-no-files-found: ignore

      - name: Commitar o historico atualizado
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add history.json
          git diff --staged --quiet || git commit -m "chore: historico da edicao semanal"
          git push
