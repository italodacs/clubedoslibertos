# Fontes fixas da newsletter.
#
# Definidas pela Presidencia e verificadas com o proprio collector em
# 25/08/2026 — veja docs/fontes-avaliadas.md para o historico completo,
# inclusive as reprovadas e o motivo de cada reprovacao.
#
# O campo `titulo` tem tres modos:
#   ausente          -> o titulo e o texto do proprio link
#   bloco            -> o texto do bloco inteiro, para portal cujo link diz so
#                       "Estagiario" e a empresa esta em volta
#   <seletor CSS>    -> um elemento dentro do bloco, para card cuja ancora e
#                       vazia e o titulo mora num h2 a parte

# --- Trainee ---

- nome: Seja Trainee
  url: https://sejatrainee.com.br/
  tipo: html
  categoria: trainee
  seletor: ".jeg_post_title"
  afirmativa: false

- nome: Vagas.com Trainee
  url: https://www.vagas.com.br/vagas-de-trainee
  tipo: html
  categoria: trainee
  seletor: ".informacoes-header"
  titulo: bloco
  afirmativa: false

# --- Estagio ---

- nome: Cia de Estagios
  url: https://www.ciadeestagios.com.br/vagas-de-estagio/
  tipo: html
  categoria: estagio
  # A propria pagina marca a vaga encerrada com --expired; o seletor a exclui.
  seletor: ".vagas__card:not(.--expired)"
  titulo: ".vagas__card__title"
  afirmativa: false

- nome: Estagio Trainee
  url: https://www.estagiotrainee.com/vagas-programas-estagio
  tipo: html
  categoria: estagio
  # Site em Wix: as classes sao hashes gerados e mudam a cada rebuild, entao a
  # unica ancora estavel e o proprio padrao de href.
  seletor: 'a[href*="/post/"]'
  afirmativa: false

- nome: Vagas.com Estagio
  url: https://www.vagas.com.br/vagas-de-estagio
  tipo: html
  categoria: estagio
  seletor: ".informacoes-header"
  titulo: bloco
  afirmativa: false

