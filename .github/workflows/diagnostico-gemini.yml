name: Diagnostico do Gemini

# Roda so quando alguem pede. Serve para descobrir por que uma chamada ao
# Gemini falha, sem precisar disparar a newsletter inteira.
on:
  workflow_dispatch:

jobs:
  diagnostico:
    runs-on: ubuntu-latest
    environment: BREVO_API_KEY
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Instalar o cliente do Gemini
        run: pip install google-genai==2.4.0

      - name: Diagnosticar
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python scripts/diagnostico_gemini.py
